# Phoenix for Klipper -- experimental 0.1
# Include once from printer.cfg: [include phoenix.cfg]
# If [force_move] already exists, add enable_force_move there; do not duplicate.
[force_move]
enable_force_move: True

[phoenix]
state_path: ~/printer_data/phoenix
save_interval: 2.0
history_size: 30

# Review the machine-coordinate park point, clearance and path on YOUR printer.
# Preparation is blocked until this is explicitly set to True.
profile_ready: False
park_x: 10
park_y: 10
clearance: 5
travel_speed: 40
z_speed: 3
max_selection_z_delta: 2

# Optional ONLY after auditing homing_override/safe_z_home/macros.
# The default assumes XYZ have not moved and does not home any axis.
# Never add G28 Z, unqualified G28, probing, QGL or Z_TILT_ADJUST here.
home_xy_gcode:
    # G28 X Y

[gcode_macro PHOENIX_RECOVERY]
description: Open the Phoenix recovery checklist
gcode:
    PHOENIX_PROMPT

# Slicer integration:
#   PHOENIX_START after PRINT_START/initialization, before model extrusion.
#   PHOENIX_END immediately after the final model extrusion, BEFORE end/park macros.
# Optional layer-change command: PHOENIX_LAYER Z=<actual nominal layer height>
# Z-hop is supported; never replace PHOENIX_LAYER with the hopped height.
