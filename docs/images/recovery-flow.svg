<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 228" role="img" aria-labelledby="title desc">
<title id="title">From interruption to a second chance</title><desc id="desc">Record, inspect the interrupted print, park and clean the nozzle, then reheat and resume with your confirmation.</desc>
<rect width="960" height="228" rx="22" fill="#23262b"/>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
<g fill="none" stroke="#f5b23a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
<path d="M77 91h54M82 83h44M87 75h34M93 67h22M104 40v14m-7 0h14l-7 9Z"/>
<path d="m305 46-17 28h16l-6 23 28-34h-18l7-17"/>
<path d="M480 43 505 53v21q0 17-25 27-25-10-25-27V53Z"/><path d="m467 70 9 9 18-21"/>
<path d="M637 92h58M645 44h16v20l-8 9-8-9Zm30 14h19m-17 12h11M662 82h25"/>
<circle cx="854" cy="72" r="28"/><path d="m848 59 18 13-18 13Z"/>
</g>
<g fill="#7c838c" font-size="26"><text x="205" y="80">&#8594;</text><text x="395" y="80">&#8594;</text><text x="575" y="80">&#8594;</text><text x="760" y="80">&#8594;</text></g>
<g fill="#f4f4f5" font-size="17" font-weight="700"><text x="104" y="138">Print normally</text><text x="305" y="138">Power interrupted</text><text x="480" y="138">Check the print</text><text x="666" y="138">Park &amp; clean</text><text x="854" y="138">Resume</text></g>
<g fill="#b9bec6" font-size="13"><text x="104" y="161">Phoenix keeps a record</text><text x="305" y="161">Recovery is offered</text><text x="480" y="161">You confirm the position</text><text x="666" y="161">Prepare the nozzle</text><text x="854" y="161">Reheat &amp; return</text></g>
<text x="480" y="205" fill="#f5b23a" font-size="13">You stay in control. Recovery never starts automatically.</text>
</g></svg>
